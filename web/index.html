<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>SlotBrief — schedules, without the surprises</title>
<style>
:root {
  --bg: #000; --fg: #fafafa; --fg-2: rgba(250,250,250,.64); --fg-3: rgba(250,250,250,.40);
  --line: rgba(255,255,255,.12); --line-2: rgba(255,255,255,.24); --glass: rgba(255,255,255,.055);
  --warn: #e9c46a; --bad: #ff7b6b;
  --serif: ui-serif, "New York", "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, "Segoe UI", Arial, sans-serif;
  --gutter: clamp(20px, 3.2vw, 44px);
}
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- nav ---------- */
.nav { position: fixed; inset: 0 0 auto 0; z-index: 40; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 18px var(--gutter); background: linear-gradient(#000 0%, rgba(0,0,0,.72) 55%, rgba(0,0,0,0)); }
.nav .l { justify-self: start; position: relative; }
.nav .r { justify-self: end; display: flex; align-items: center; gap: 22px; }
.wordmark { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .09em; font-size: 17px; }
.wordmark svg { display: block; }
.tl-link { font-size: 14px; color: var(--fg); opacity: .92; }
.tl-link:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.pillbtn { display: inline-flex; align-items: center; gap: 16px; padding: 5px 5px 5px 20px; border-radius: 999px; background: rgba(255,255,255,.15);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 15px; white-space: nowrap; transition: background .2s; }
.pillbtn:hover { background: rgba(255,255,255,.24); }
.pillbtn .go { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; flex: none; }
.pillbtn.sm { font-size: 13.5px; padding: 3px 3px 3px 16px; gap: 12px; } .pillbtn.sm .go { width: 24px; height: 24px; }
.menu-list { position: absolute; left: 0; top: calc(100% + 12px); min-width: 250px; padding: 8px; display: none; border-radius: 16px;
  background: rgba(24,24,24,.86); border: 1px solid var(--line); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.menu-list.open { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; padding: 11px 14px; border-radius: 10px; font-size: 14px; color: var(--fg-2); }
.menu-list button:hover { background: var(--glass); color: var(--fg); }

/* ---------- hero ---------- */
.hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 120px var(--gutter) clamp(28px, 5vh, 56px); overflow: hidden; isolation: isolate; }
.hero svg.art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(120% 90% at 50% 0%, transparent 35%, rgba(0,0,0,.55) 100%), linear-gradient(to top, #000 4%, rgba(0,0,0,0) 46%); }
.hero h1 { font: 300 clamp(44px, 7.2vw, 108px)/1.02 var(--serif); letter-spacing: -.025em; margin: 0 0 clamp(18px, 3vh, 34px); max-width: 15ch; }
.hero .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.hero .row p { margin: 0; max-width: 300px; color: var(--fg-2); font-size: 15px; line-height: 1.45; }
.hero .hint { margin-left: auto; color: var(--fg-3); font-size: 13.5px; }
.hint u { text-decoration: none; border-bottom: 1px solid var(--line-2); color: var(--fg-2); cursor: pointer; }

.art .gl { stroke: rgba(255,255,255,.10); stroke-width: 1; stroke-dasharray: 3 6; }
.art .tx { fill: rgba(255,255,255,.34); font: 11px var(--sans); }
.art .bk { fill: rgba(255,255,255,.05); stroke: rgba(255,255,255,.46); stroke-width: 1; }
.art .bk.warn { stroke: var(--warn); fill: rgba(233,196,106,.09); }
.art .bk.bad { stroke: var(--bad); fill: rgba(255,123,107,.17); }
.art .bk { opacity: 0; animation: rise 1.1s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .art .bk { animation: none; opacity: 1; } }

/* ---------- editorial sections ---------- */
.section { padding: clamp(72px, 12vh, 150px) var(--gutter); max-width: 1320px; margin: 0 auto; }
.statement { font: 300 clamp(26px, 3.6vw, 50px)/1.18 var(--serif); letter-spacing: -.015em; margin: 0; max-width: 24em; }
.statement em { font-style: normal; color: var(--fg-3); }
.checks { margin-top: clamp(48px, 8vh, 96px); border-top: 1px solid var(--line); }
.check { display: grid; grid-template-columns: 70px minmax(150px, 280px) 1fr; gap: 24px; padding: 26px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.check .n { color: var(--fg-3); font-size: 13px; }
.check h3 { margin: 0; font: 400 24px/1.2 var(--serif); }
.check p { margin: 0; color: var(--fg-2); max-width: 46ch; }
.foot { border-top: 1px solid var(--line); padding: 28px var(--gutter) 40px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  color: var(--fg-3); font-size: 13px; }
.dropveil { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; background: rgba(0,0,0,.82); backdrop-filter: blur(10px); }
.dropveil.on { display: grid; }
.dropveil div { font: 300 clamp(32px, 5vw, 64px)/1.1 var(--serif); text-align: center; padding: 60px; border: 1px dashed var(--line-2); border-radius: 28px; }

/* ---------- app ---------- */
.app { max-width: 1320px; margin: 0 auto; padding: 108px var(--gutter) 80px; }
.app-h { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
.app-h h1 { font: 300 clamp(36px, 5vw, 68px)/1.05 var(--serif); letter-spacing: -.02em; margin: 0; }
.app-h .eyebrow { color: var(--fg-3); font-size: 13px; margin-bottom: 10px; }
.opts { display: flex; gap: 26px; flex-wrap: wrap; }
.opt { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--fg-3); }
.opt input { background: transparent; border: 0; border-bottom: 1px solid var(--line-2); padding: 6px 0; color: var(--fg); font-size: 15px; width: 112px; border-radius: 0; }
.opt input:focus { outline: 0; border-bottom-color: var(--fg); }
.opt.wide input { width: 210px; }
.opt.nar input { width: 60px; }

.tabs + div > .kpis:first-child { border-top: 0; }
.tabs { display: flex; gap: 26px; margin-bottom: 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; padding: 0 0 14px; color: var(--fg-3); font-size: 14.5px; position: relative; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover { color: var(--fg-2); }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--fg); }
.dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--fg-3); flex: none; }
.dot.warn { background: var(--warn); border-color: var(--warn); } .dot.bad { background: var(--bad); border-color: var(--bad); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: clamp(44px, 7vh, 80px); }
.kpi { padding: 26px 0 28px 28px; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .l { color: var(--fg-3); font-size: 13px; }
.kpi .v { font: 300 clamp(40px, 5vw, 72px)/1.05 var(--serif); letter-spacing: -.025em; margin-top: 8px; }
.kpi .v small { font: 400 14px var(--sans); letter-spacing: 0; color: var(--fg-3); margin-left: 8px; }
.kpi.bad .v { color: var(--bad); } .kpi.warn .v { color: var(--warn); }
.meter { height: 1px; background: var(--line-2); margin-top: 16px; position: relative; max-width: 220px; }
.meter i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--fg); }
.meter i.over { background: var(--bad); }

.sec { margin-bottom: clamp(44px, 7vh, 80px); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.sec-h h2 { font: 300 clamp(26px, 2.8vw, 38px)/1.1 var(--serif); letter-spacing: -.015em; margin: 0; }
.sec-h .sub { color: var(--fg-3); font-size: 13px; text-align: right; }

/* timeline */
.tl-wrap { overflow-x: auto; padding: 24px 18px 0; margin: 0 -18px; }
.tl { position: relative; min-width: 680px; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed rgba(255,255,255,.10); }
.tick span { position: absolute; top: -22px; left: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--fg-3); }
.openwin { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.028); }
.bar { position: absolute; height: 46px; padding: 6px 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,.34); background: rgba(255,255,255,.06);
  text-align: left; display: flex; flex-direction: column; justify-content: center; overflow: hidden; line-height: 1.25; transition: background .2s, transform .2s; }
.bar b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar small { font-size: 11.5px; color: var(--fg-2); white-space: nowrap; }
.bar:hover, .bar.hl { background: rgba(255,255,255,.14); transform: translateY(-2px); z-index: 3; }
.bar.warn { border-color: var(--warn); background: rgba(233,196,106,.10); }
.bar.bad { border-color: var(--bad); background: rgba(255,123,107,.17); }
.bar.bad:hover, .bar.bad.hl { background: rgba(255,123,107,.30); }
.legend { display: flex; gap: 22px; margin-top: 20px; color: var(--fg-3); font-size: 12.5px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 9px; border-radius: 3px; border: 1px solid; margin-right: 8px; }

/* schedule + issues */
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: clamp(36px, 5vw, 84px); align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 400; font-size: 12.5px; color: var(--fg-3); padding: 0 12px 12px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 17px 12px 17px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 15px; }
td.t { white-space: nowrap; color: var(--fg-2); }
td .who { display: block; font: 400 19px/1.2 var(--serif); }
td .tr { display: block; color: var(--fg-3); font-size: 13px; margin-top: 3px; }
tr.row { transition: background .3s; }
tr.row.hl { background: rgba(255,255,255,.07); }
.st { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--fg-2); white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--fg-3); }
.st.warn { color: var(--warn); } .st.warn i { background: var(--warn); border-color: var(--warn); }
.st.bad { color: var(--bad); } .st.bad i { background: var(--bad); border-color: var(--bad); }
.copy { font-size: 13px; color: var(--fg-2); border-bottom: 1px solid var(--line-2); padding-bottom: 1px; white-space: nowrap; }
.copy:hover { color: var(--fg); border-color: var(--fg); }

.issue { display: block; width: 100%; text-align: left; padding: 20px 0; border-bottom: 1px solid var(--line); }
.issue:first-child { border-top: 1px solid var(--line-2); }
.issue .k { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-3); margin-bottom: 6px; }
.issue .k i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.issue.bad .k { color: var(--bad); } .issue.bad .k i { background: var(--bad); }
.issue.warn .k { color: var(--warn); }
.issue .m { font: 400 18px/1.35 var(--serif); color: var(--fg); }
.issue:hover .m { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 4px; }
.allclear { font: 300 28px/1.2 var(--serif); padding: 26px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); color: var(--fg); }
.allclear small { display: block; font: 400 14px var(--sans); color: var(--fg-3); margin-top: 8px; }

/* fixes */
.fixes { border-top: 1px solid var(--line-2); }
.fixrow { display: grid; grid-template-columns: minmax(160px, 1.1fr) 1fr auto; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--line); }
.fixrow .who { font: 400 19px/1.2 var(--serif); }
.fixrow .tr { display: block; color: var(--fg-3); font-size: 13px; margin-top: 3px; }
.fixrow .mv { font-variant-numeric: tabular-nums; color: var(--fg-2); }
.fixrow .mv b { color: var(--fg); font-weight: 500; }
.fixrow .shift { color: var(--fg-3); font-size: 13px; text-align: right; white-space: nowrap; }
.fixbar { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-top: 26px; }
.fixbar p { margin: 0; color: var(--fg-2); max-width: 46ch; }
.applied { color: var(--fg-2); }
.bar.moved { border-style: dashed; }
.mvd { color: var(--fg-2); }
@media (max-width: 720px) { .fixrow { grid-template-columns: 1fr; gap: 4px; } .fixrow .shift { text-align: left; } }

/* fit finder */
.fitform { display: flex; flex-wrap: wrap; gap: 22px 28px; align-items: flex-end; margin-bottom: 28px; }
.fitrow { display: grid; grid-template-columns: minmax(160px, 1.1fr) 1.6fr auto; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--line); }
.fitrow .when { font: 400 22px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.fitrow .tag { display: block; color: var(--fg-3); font-size: 13px; margin-top: 3px; }
.fitrow .tag.free { color: var(--ok, var(--fg-2)); }
.fitrow .who { color: var(--fg-2); }
.fitrow .who b { color: var(--fg); font-weight: 500; }
.fitrow .who div + div { margin-top: 6px; }
.fitrow .cp { text-align: right; white-space: nowrap; }
@media (max-width: 720px) { .fitrow { grid-template-columns: 1fr; gap: 4px; } .fitrow .cp { text-align: left; } }

/* overview */
.ov { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); border-top: 1px solid var(--line); }
.ovc { text-align: left; padding: 26px 24px 30px 0; border-bottom: 1px solid var(--line); }
.ovc + .ovc { padding-left: 24px; border-left: 1px solid var(--line); }
.ovc:hover h3 { text-decoration: underline; text-underline-offset: 6px; text-decoration-color: var(--line-2); }
.ovc h3 { font: 300 30px/1.1 var(--serif); margin: 0 0 4px; letter-spacing: -.01em; }
.ovc .d { color: var(--fg-3); font-size: 13px; margin-bottom: 26px; }
.ovc .big { font: 300 44px/1 var(--serif); letter-spacing: -.02em; }
.ovc .big small { font: 400 13px var(--sans); color: var(--fg-3); margin-left: 6px; letter-spacing: 0; }

.toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px); background: rgba(255,255,255,.94); color: #000; padding: 11px 20px;
  border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 100; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.err { border: 1px solid var(--bad); color: var(--bad); padding: 14px 18px; border-radius: 12px; margin-bottom: 28px; }

@media (max-width: 720px) {
  .nav { padding: 14px var(--gutter); }
  .wordmark span.t { font-size: 15px; } .tl-link.hide-m { display: none; }
  .hero .hint { margin-left: 0; width: 100%; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi { padding: 20px 0 22px 20px; } .kpi:nth-child(odd) { border-left: 0; padding-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .check { grid-template-columns: 40px 1fr; } .check p { grid-column: 2; }
  .ovc + .ovc { padding-left: 0; border-left: 0; }
  .sec-h .sub { display: none; }
}
@media print {
  html, body { background: #fff; color: #000; } .nav, .toast, .tabs, .opts, .copy { display: none !important; }
  .app { padding-top: 0; } * { color: #000 !important; border-color: #bbb !important; }
}
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="root"></div>
<div class="dropveil" id="veil"><div>Drop your CSV</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept=".csv,text/csv" multiple hidden>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;            // fixed, hard-coded SVG markup only
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false && kid !== "") el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const ARROW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const MARK = '<svg width="22" height="20" viewBox="0 0 22 20" fill="currentColor"><rect x="0" y="0" width="14" height="5" rx="1.5"/><rect x="5" y="7.5" width="17" height="5" rx="1.5"/><rect x="0" y="15" width="11" height="5" rx="1.5"/></svg>';
const pill = (label, onclick, cls = "") => h("button", { class: "pillbtn " + cls, onclick }, label, h("span", { class: "go", html: ARROW }));

const S = { files: [], opts: { clinic: "Indie Clinic", hours: "09:00-18:00", min_gap: 10 }, result: null, view: "0", error: "", autofix: false, fit: { duration: 45, treatment: "Walk-in", prefer: "", options: null, day: "" } };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("show"), 1900);
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(msg);
}
function download(name, text, type) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

async function analyse() {
  S.error = ""; S.fit.options = null;
  try {
    const res = await fetch("/api/analyse", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ files: S.files, ...S.opts, autofix: S.autofix }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    S.result = data;
    if (S.view !== "overview" && !(S.view in data.days)) S.view = data.mode === "week" ? "overview" : "0";
  } catch (e) { S.error = e.message; if (!S.result) S.files = []; }
  render();
}
async function loadFiles(list) {
  const files = [];
  for (const f of list) files.push({ name: f.name, text: await f.text() });
  S.files = files; S.result = null; S.autofix = false; await analyse();
  if (S.result) { S.view = S.result.mode === "week" ? "overview" : "0"; render(); window.scrollTo(0, 0); }
}
async function loadSample(kind, opts = {}) {
  const p = await (await fetch("/api/sample?kind=" + kind)).json();
  S.files = p.files; S.opts.clinic = p.clinic; S.result = null; S.autofix = !!opts.autofix; await analyse();
  if (S.result) { S.view = S.result.mode === "week" ? "overview" : "0"; render(); window.scrollTo(0, 0); }
}

/* ---------- nav ---------- */
function nav() {
  const n = $("#nav"); n.replaceChildren();
  const r = S.result;
  const left = h("div", { class: "l" });
  if (r) {
    const list = h("div", { class: "menu-list", id: "menuList", role: "menu" },
      mi("Download calendar (.ics)", () => download(r.mode === "week" ? "slotbrief-week.ics" : `slotbrief-${r.days[0].day}.ics`, r.ics, "text/calendar")),
      mi("Copy all confirmation texts", () => copyText(r.days.flatMap(d => d.appointments.map(a => a.confirmation)).join("\n\n"), "All confirmations copied")),
      mi("Download report (.json)", () => { const { ics, ...rest } = r; download("slotbrief-report.json", JSON.stringify(rest, null, 2), "application/json"); }),
      mi(r.autofix ? "Download fixed schedule (.csv)" : "Download schedule (.csv)", () => download("slotbrief-schedule.csv", r.csv, "text/csv")),
      mi("Print this view", () => window.print()));
    function mi(label, fn) { return h("button", { role: "menuitem", onclick: () => { list.classList.remove("open"); fn(); } }, label); }
    left.append(h("button", { class: "tl-link", "aria-haspopup": "menu", onclick: e => { e.stopPropagation(); list.classList.toggle("open"); } }, "Export"), list);
  } else left.append(h("button", { class: "tl-link", onclick: () => $("#picker").click() }, "Choose file"));
  const mid = h("div", { class: "wordmark", "aria-label": "SlotBrief" }, h("span", { html: MARK }), h("span", { class: "t" }, "SLOTBRIEF"));
  const right = h("div", { class: "r" },
    r ? h("button", { class: "tl-link", onclick: () => { S.result = null; S.files = []; S.error = ""; S.autofix = false; render(); window.scrollTo(0, 0); } }, "New file")
      : h("button", { class: "tl-link hide-m", onclick: () => loadSample("week") }, "Sample week"),
    r ? null : pill("Try a sample day", () => loadSample("day"), "sm"));
  n.append(left, mid, right);
}

/* ---------- landing ---------- */
function heroArt() {
  // The product, drawn as line-art: a chair timeline with one collision.
  const W = 1200, H = 760, x0 = 70, hw = 122;                       // hour width
  const X = m => x0 + (m - 540) / 60 * hw;                          // minutes since midnight -> x
  const lanes = [[[540, 45, ""], [600, 60, ""], [790, 50, "warn"], [890, 75, ""]], [[560, 30, ""], [660, 50, ""], [740, 90, "bad"], [980, 60, ""]], [[620, 60, ""], [750, 70, "bad"], [850, 40, "warn"]], [[570, 45, ""], [700, 30, ""], [880, 60, ""], [960, 40, "warn"]]];
  let s = `<svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`;
  for (let hr = 9; hr <= 18; hr++) { const x = x0 + (hr - 9) * hw; s += `<line class="gl" x1="${x}" y1="150" x2="${x}" y2="620"/><text class="tx" x="${x}" y="136" text-anchor="middle">${String(hr).padStart(2, "0")}</text>`; }
  lanes.forEach((ln, i) => ln.forEach(([m, d, c], j) => { s += `<rect class="bk ${c}" x="${X(m)}" y="${190 + i * 100}" width="${d / 60 * hw}" height="64" rx="14" style="animation-delay:${(i * 4 + j) * 80}ms"/>`; }));
  return h("div", { html: s + "</svg>" }).firstChild;
}
function landing() {
  const checks = [
    ["Overlaps", "Two bookings claim the same chair at the same time."],
    ["Tight turnarounds", "Less than your minimum gap between patients — no time to reset the room."],
    ["Late starts", "A first booking after 11:00, so the morning goes unused."],
    ["Double-booked patients", "The same person holding two slots at once, so a confirmation would be wrong."],
    ["Unreachable numbers", "A phone number too short, or with letters in it, that can never receive the text."],
  ];
  return h("div", {},
    S.error && h("div", { class: "err", style: "margin:96px var(--gutter) -80px;position:relative;z-index:5" }, S.error),
    h("section", { class: "hero" },
      heroArt(),
      h("h1", {}, "Schedules, without the surprises."),
      h("div", { class: "row" },
        h("p", {}, "A local-first briefing tool for independent clinics. Drop in a day of appointments."),
        pill("Try a sample day", () => loadSample("day")),
        h("span", { class: "hint" }, "or drop a CSV anywhere · ", h("u", { onclick: () => $("#picker").click() }, "choose a file")))),
    h("section", { class: "section" },
      h("p", { class: "statement" }, "SlotBrief reads your day, finds the mistakes before the patient does, ", h("em", {}, "drafts every confirmation, and exports your calendar. It runs on this machine — nothing you load ever leaves it.")),
      h("div", { class: "checks" }, checks.map(([t, d], i) => h("div", { class: "check" }, h("span", { class: "n num" }, "0" + (i + 1)), h("h3", {}, t), h("p", {}, d))))),
    h("div", { class: "foot" }, h("span", {}, "SlotBrief — built for Next Byte Hacks V5"), h("span", {}, "Standard-library Python · no cloud · no tracking")));
}

/* ---------- app ---------- */
const mins = t => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const worst = d => d.appointments.some(a => a.status === "bad") ? "bad" : d.issues.length ? "warn" : "ok";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const niceDay = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const longDay = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

function head(r) {
  const mk = (cls, label, key, type = "text", extra = {}) => h("label", { class: "opt " + cls }, label,
    h("input", { type, value: S.opts[key], ...extra, onchange: e => { S.opts[key] = type === "number" ? Number(e.target.value) : e.target.value.trim(); analyse(); } }));
  const d = S.view !== "overview" && r.mode === "week" ? r.days[Number(S.view) || 0] : null;
  const title = r.mode === "day" ? longDay(r.days[0].day) : d ? longDay(d.day) : "Week at a glance";
  return h("div", { class: "app-h" },
    h("div", {}, h("div", { class: "eyebrow" }, r.clinic), h("h1", {}, title)),
    h("div", { class: "opts" },
      mk("wide", "Clinic", "clinic", "text", { maxlength: 80 }),
      mk("", "Open hours", "hours", "text", { placeholder: "09:00-18:00", "aria-label": "Open hours, HH:MM-HH:MM" }),
      mk("nar", "Min gap", "min_gap", "number", { min: 0, max: 240, "aria-label": "Minimum gap in minutes" })));
}

function kpis(totals, scope) {
  const m = scope.chair_minutes ?? totals.chair_minutes, util = scope.utilisation_pct ?? totals.avg_utilisation_pct, flags = scope.flags ?? totals.flags;
  const card = (l, v, cls = "", small = "", extra) => h("div", { class: "kpi " + cls }, h("div", { class: "l" }, l), h("div", { class: "v num" }, v, small && h("small", {}, small)), extra);
  return h("div", { class: "kpis" },
    card("Bookings", scope.bookings ?? totals.bookings),
    card("Chair time", Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0")),
    card(scope.utilisation_pct != null ? "Utilisation" : "Average utilisation", util + "%", util > 100 ? "bad" : "", "", h("div", { class: "meter" }, h("i", { class: util > 100 ? "over" : "", style: `width:${Math.min(util, 100)}%` }))),
    card("Needs attention", flags, flags ? "warn" : "", flags ? (flags === 1 ? "issue" : "issues") : "all clear"));
}

function tabs(r) {
  const t = [h("button", { class: "tab", role: "tab", "aria-selected": String(S.view === "overview"), onclick: () => { S.view = "overview"; render(); } }, "Overview")];
  r.days.forEach((d, i) => t.push(h("button", { class: "tab", role: "tab", "aria-selected": String(S.view === String(i)), onclick: () => { S.view = String(i); render(); } },
    h("span", { class: "dot " + worst(d) }), niceDay(d.day))));
  return h("div", { class: "tabs", role: "tablist" }, t);
}

function overview(r) {
  return h("div", {}, kpis(r.totals, {}),
    h("div", { class: "sec" }, h("div", { class: "sec-h" }, h("h2", {}, "The week"), h("span", { class: "sub" }, "Select a day to open it")),
      h("div", { class: "ov" }, r.days.map((d, i) => h("button", { class: "ovc", onclick: () => { S.view = String(i); render(); window.scrollTo(0, 0); } },
        h("h3", {}, d.weekday), h("div", { class: "d" }, niceDay(d.day)),
        h("div", { class: "big num" }, d.stats.utilisation_pct + "%", h("small", {}, "utilised")),
        h("div", { class: "meter", style: "margin:14px 0 18px" }, h("i", { class: d.stats.utilisation_pct > 100 ? "over" : "", style: `width:${Math.min(d.stats.utilisation_pct, 100)}%` })),
        h("span", { class: "st " + worst(d) }, h("i"), plural(d.stats.bookings, "booking") + " · " + (d.stats.flags ? plural(d.stats.flags, "flag") : "clear")))))));
}

function timeline(d, r) {
  const open = mins(r.hours.open), close = mins(r.hours.close);
  let lo = Math.min(open, ...d.appointments.map(a => mins(a.time)));
  let hi = Math.max(close, ...d.appointments.map(a => mins(a.time) + a.duration_min));
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60; const total = hi - lo;
  const laneEnd = [];
  const placed = d.appointments.map((a, i) => ({ a, i })).sort((x, y) => mins(x.a.time) - mins(y.a.time)).map(({ a, i }) => {
    let lane = laneEnd.findIndex(e => e <= mins(a.time)); if (lane < 0) { lane = laneEnd.length; laneEnd.push(0); }
    laneEnd[lane] = mins(a.time) + a.duration_min; return { a, i, lane };
  });
  const pct = m => ((m - lo) / total * 100).toFixed(3) + "%";
  const el = h("div", { class: "tl", style: `height:${laneEnd.length * 54}px` }, h("div", { class: "openwin", style: `left:${pct(open)};width:${((close - open) / total * 100).toFixed(3)}%` }));
  for (let m = lo; m <= hi; m += 60) el.append(h("i", { class: "tick", style: `left:${pct(m)}` }, h("span", { class: "num" }, String(m / 60).padStart(2, "0"))));
  placed.forEach(({ a, i, lane }) => el.append(h("button", {
    class: "bar " + a.status + (a.moved_from ? " moved" : ""), "data-i": i, style: `left:${pct(mins(a.time))};width:${(a.duration_min / total * 100).toFixed(3)}%;top:${lane * 54}px`,
    title: `${a.patient} · ${a.treatment} · ${a.time}–${a.end}`,
    "aria-label": `${a.patient}, ${a.treatment}, ${a.time} to ${a.end}, ${a.status === "ok" ? "no issues" : a.status === "warn" ? "worth a look" : "time conflict"}`,
    onclick: () => focusRow(i),
  }, h("b", {}, a.patient), h("small", { class: "num" }, a.moved_from ? `moved from ${a.moved_from}` : a.time + "–" + a.end))));
  const lg = (c, t) => h("span", {}, h("i", { style: `border-color:${c}` }), t);
  return h("div", { class: "sec" },
    h("div", { class: "sec-h" }, h("h2", {}, "Chair timeline"), h("span", { class: "sub" }, "Click a booking to find it below")),
    h("div", { class: "tl-wrap" }, el),
    h("div", { class: "legend" }, lg("rgba(255,255,255,.4)", "On track"), lg("var(--warn)", "Worth a look"), lg("var(--bad)", "Time conflict"), h("span", {}, "Shaded band = open hours")));
}

function focusRow(i) {
  document.querySelectorAll(".hl").forEach(n => n.classList.remove("hl"));
  const row = $(`tr[data-i="${i}"]`); if (!row) return;
  row.classList.add("hl"); row.scrollIntoView({ block: "center", behavior: "smooth" });
  $(`.bar[data-i="${i}"]`)?.classList.add("hl");
  setTimeout(() => document.querySelectorAll(".hl").forEach(n => n.classList.remove("hl")), 1800);
}

const STATUS = { ok: "On track", warn: "Check", bad: "Conflict" };
function schedule(d) {
  const rows = d.appointments.map((a, i) => h("tr", { class: "row", "data-i": i },
    h("td", { class: "t num" }, a.time + " – " + a.end),
    h("td", {}, h("span", { class: "who" }, a.patient), h("span", { class: "tr" }, (a.moved_from ? "Moved from " + a.moved_from + " · " : "") + a.treatment + (a.notes ? " · " + a.notes : ""))),
    h("td", {}, h("span", { class: "st " + a.status }, h("i"), STATUS[a.status])),
    h("td", {}, h("button", { class: "copy", onclick: () => copyText(a.confirmation, `Message for ${a.patient.split(" ")[0]} copied`), "aria-label": `Copy message for ${a.patient}` }, a.moved_from ? "Copy new time" : "Copy message"))));
  return h("div", { class: "sec" },
    h("div", { class: "sec-h" }, h("h2", {}, "Schedule"), h("span", { class: "sub" }, plural(d.appointments.length, "booking"))),
    h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Time", "Patient", "Status", ""].map(c => h("th", {}, c)))), h("tbody", {}, rows))));
}

function issues(d) {
  const kind = k => (k === "overlap" || k === "double_booked_patient") ? "bad" : "warn";
  const items = d.issues.map(i => h("button", {
    class: "issue " + kind(i.kind),
    onclick: () => { const idx = d.appointments.findIndex(a => i.related.includes(a.patient)); if (idx >= 0) focusRow(idx); },
  }, h("div", { class: "k" }, h("i"), i.label), h("div", { class: "m" }, i.message)));
  return h("div", { class: "sec" },
    h("div", { class: "sec-h" }, h("h2", {}, "Needs attention"), h("span", { class: "sub" }, d.issues.length ? plural(d.issues.length, "issue") : "")),
    items.length ? h("div", {}, items) : h("div", { class: "allclear" }, "All clear.", h("small", {}, "Nothing to fix on this day.")));
}

function fixes(d, r) {
  const f = d.fix;
  if (!f.moves.length && !f.unplaced.length) return null;
  const rows = f.moves.map(m => h("div", { class: "fixrow" },
    h("div", {}, h("span", { class: "who" }, m.patient), h("span", { class: "tr" }, m.treatment)),
    h("div", { class: "mv num" }, m.old, " → ", h("b", {}, m.new)),
    h("div", { class: "shift num" }, Math.abs(m.shift_min) + " min " + (m.shift_min < 0 ? "earlier" : "later"))));
  const summary = `${plural(f.moves.length, "booking")} moved · ${f.conflicts_before} scheduling ${f.conflicts_before === 1 ? "conflict" : "conflicts"} → ${f.conflicts_after}`;
  return h("div", { class: "sec" },
    h("div", { class: "sec-h" }, h("h2", {}, r.autofix ? "Fixes applied" : "Suggested fixes"), h("span", { class: "sub" }, "Fewest possible moves, each to the nearest free slot")),
    h("div", { class: "fixes" }, rows),
    f.unplaced.length ? h("p", { class: "applied", style: "margin-top:16px;color:var(--warn)" }, `${plural(f.unplaced.length, "booking")} can’t fit inside open hours — call ${f.unplaced.map(u => u.patient).join(", ")}.`) : null,
    h("div", { class: "fixbar" },
      r.autofix
        ? [h("p", {}, summary + ". Reschedule messages are ready to copy below."), h("button", { class: "tl-link", onclick: () => { S.autofix = false; analyse(); } }, "Revert to original")]
        : [pill("Apply fixes", () => { S.autofix = true; analyse(); }), h("p", {}, summary + " if applied.")]));
}


function fitPanel(d, r) {
  const F = S.fit;
  const field = (label, key, type, extra) => h("label", { class: "opt" }, label,
    h("input", { type, value: F[key], ...extra, onchange: e => { F[key] = type === "number" ? Number(e.target.value) : e.target.value.trim(); F.options = null; } }));
  const find = async () => {
    try {
      const res = await fetch("/api/fit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ files: S.files, ...S.opts, for_day: d.day, duration: F.duration, treatment: F.treatment, prefer: F.prefer }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      F.options = data; F.day = d.day; render();
    } catch (e) { toast(e.message); }
  };
  const res = F.options && F.day === d.day ? F.options : null;
  const rows = res ? res.options.map(o => h("div", { class: "fitrow" },
    h("div", {}, h("span", { class: "when" }, o.time + "–" + o.end),
      h("span", { class: "tag" + (o.moves.length ? "" : " free") }, o.moves.length ? plural(o.moves.length, "booking") + " moves · " + o.disruption_min + " min of shifting" : "Nobody moves")),
    o.moves.length
      ? h("div", { class: "who" }, o.moves.map(m => h("div", {}, h("b", {}, m.patient), " ", m.old, " → ", h("b", {}, m.new))))
      : h("div", { class: "who" }, o.free_from === o.free_to ? "Only this start works." : `Any start from ${o.free_from} to ${o.free_to} works.`),
    h("div", { class: "cp" }, o.moves.length ? h("button", { class: "tl-link", onclick: () => copyText(o.moves.map(m => m.message).join("\n\n"), "Reschedule text copied") }, "Copy message" + (o.moves.length > 1 ? "s" : "")) : null))) : [];
  return h("div", { class: "sec" },
    h("div", { class: "sec-h" }, h("h2", {}, "Fit someone in"), h("span", { class: "sub" }, "Ranked by who has to move, then by how far")),
    h("div", { class: "fitform" },
      field("Minutes", "duration", "number", { min: 5, max: 480, step: 5, class: "num" }),
      field("Treatment", "treatment", "text"),
      field("Prefers (HH:MM)", "prefer", "text", { placeholder: "any time" }),
      pill("Find a slot", find)),
    res && !res.options.length ? h("div", { class: "allclear" }, "Nowhere today.", h("small", {}, "Even moving everyone who can move, a " + res.duration + "-minute booking doesn’t fit.")) : h("div", { class: "fixes" }, rows),
    res && res.base_moves ? h("p", { class: "applied", style: "margin-top:16px" }, "Judged on the day after its existing conflicts are fixed, so each option’s cost is only what the new booking adds.") : null);
}

function dayView(d, r) { return h("div", {}, kpis(r.totals, d.stats), timeline(d, r), fixes(d, r), fitPanel(d, r), h("div", { class: "cols" }, schedule(d), issues(d))); }

function render() {
  nav();
  const root = $("#root"); root.replaceChildren();
  if (!S.result) { root.append(landing()); return; }
  const r = S.result;
  root.append(h("main", { class: "app" }, ...[
    S.error && h("div", { class: "err" }, S.error),
    head(r),
    r.mode === "week" && tabs(r),
    S.view === "overview" && r.mode === "week" ? overview(r) : dayView(r.days[Number(S.view) || 0], r),
  ].filter(Boolean)));
}

$("#picker").addEventListener("change", e => { if (e.target.files.length) loadFiles([...e.target.files]); e.target.value = ""; });
document.addEventListener("click", () => $("#menuList")?.classList.remove("open"));
let dragDepth = 0; const veil = $("#veil");
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; veil.classList.add("on"); });
addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; veil.classList.remove("on");
  const fs = [...e.dataTransfer.files].filter(f => /\.csv$/i.test(f.name));
  if (fs.length) loadFiles(fs); else { S.error = "Please drop .csv files."; render(); }
});
render();
const q = new URLSearchParams(location.search);   // ?sample=day|week[&view=overview|0..4] for demos
if (q.get("autofix")) S.autofix = true;
if (q.get("sample")) loadSample(q.get("sample") === "week" ? "week" : "day", { autofix: !!q.get("autofix") }).then(() => { if (q.get("view") && S.result) { S.view = q.get("view"); render(); } });
</script>
</body>
</html>
