<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f4f5">
<title>SlotBrief — schedules, without the surprises</title>
<style>
/* Design tokens follow the Boto system (boto.clinic): porcelain + ink + river green. */
:root {
  --porcelain: #f3f4f5; --white: #fff; --mist: #e7eaec;
  --ink: #0e1f18; --body: #24332d; --copy: #52635a; --muted: #5c6c64;
  --border: #d3ddd6; --border-strong: #b9c7bf; --hair: rgba(14,31,24,.08);
  --river: #0b6b4f; --river-deep: #07533e; --river-mist: #dcebe3;
  --trust: #10332b; --deep: #0c2a24;
  --rose: #b9706b; --rose-soft: #f4e6e4;
  --danger: #9c3544; --danger-soft: #f7e3e6;
  --amber: #9a6414; --amber-soft: #f7ecd5;
  --foot-ink: #f1f5f2; --foot-copy: #b6c6bd; --foot-quiet: #9eada4; --foot-border: #2c463d;
  --font: "Instrument Sans", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --gutter: clamp(20px, 4vw, 56px);
  --shadow: 0 1px 2px rgba(14,31,24,.06), 0 12px 32px -12px rgba(14,31,24,.12);
}
* { box-sizing: border-box; }
html { background: var(--porcelain); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; color: var(--body); font: 400 16px/1.55 var(--font); -webkit-font-smoothing: antialiased;
  background: radial-gradient(1100px 620px at 78% 8%, #fff 0, rgba(255,255,255,0) 70%), var(--porcelain); min-height: 100vh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--river); outline-offset: 3px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
a { color: inherit; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 40; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  padding: 14px var(--gutter); background: rgba(243,244,245,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.nav .l { justify-self: start; display: flex; align-items: center; }
.nav .m { display: flex; gap: 4px; }
.nav .r { justify-self: end; display: flex; align-items: center; gap: 18px; position: relative; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 650; font-size: 19px; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand svg { width: 34px; height: auto; display: block; }
.navlink { padding: 0 8px; font-size: 14px; font-weight: 500; color: var(--copy); text-decoration: none; }
.navlink:hover { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 4px 4px 4px 18px; border-radius: 999px; background: var(--river); color: #fff;
  font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 2px rgba(14,31,24,.16); transition: background .15s; }
.pill:hover { background: var(--river-deep); }
.pill .go { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--river); display: grid; place-items: center; flex: none; }
.pill.lg { font-size: 16px; padding: 6px 6px 6px 24px; gap: 18px; } .pill.lg .go { width: 40px; height: 40px; }
.ghost { display: inline-flex; align-items: center; gap: 12px; font-weight: 500; color: var(--ink); font-size: 16px; }
.ghost .ring { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-strong); background: rgba(255,255,255,.7); display: grid; place-items: center; }
.ghost:hover .ring { border-color: var(--ink); }
.btn2 { display: inline-flex; align-items: center; padding: 9px 16px; border-radius: 999px; background: var(--white); border: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--ink); }
.btn2:hover { border-color: var(--border-strong); }
.menu-list { position: absolute; right: 0; top: calc(100% + 10px); min-width: 270px; padding: 8px; display: none; border-radius: 18px; background: var(--white);
  border: 1px solid var(--hair); box-shadow: var(--shadow); }
.menu-list.open { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; padding: 11px 14px; border-radius: 10px; font-size: 14.5px; color: var(--body); }
.menu-list button:hover { background: var(--porcelain); }

/* ---------- landing ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }
.hero { padding-top: clamp(40px, 8vh, 96px); }
.hero h1 { font-weight: 650; font-size: clamp(50px, 9vw, 132px); line-height: .92; letter-spacing: -.045em; color: var(--ink); margin: 0; }
.hero .lead { display: flex; align-items: center; gap: clamp(20px, 3vw, 44px); flex-wrap: wrap; margin-top: clamp(26px, 4vh, 44px); }
.hero .lead p { margin: 0; max-width: 460px; font-size: 20px; line-height: 1.4; color: var(--copy); }
.stage { margin-top: clamp(40px, 7vh, 80px); background: var(--mist); border-radius: 32px; padding: clamp(14px, 2.4vw, 32px);
  display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 20px; align-items: stretch; }
.stage > .card { display: flex; flex-direction: column; } .stage > .card .fill { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.stage .col { display: grid; gap: 20px; }
.cap { color: var(--muted); font-size: 13px; margin: 14px 4px 0; }
.card { background: var(--white); border: 1px solid var(--hair); border-radius: 22px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 0; }
.card-h b { font-size: 15px; font-weight: 650; color: var(--ink); letter-spacing: -.01em; }
.tagpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--river-mist); color: var(--river-deep); }
.tagpill.bad { background: var(--danger-soft); color: var(--danger); } .tagpill.warn { background: var(--amber-soft); color: var(--amber); }
.mini { padding: 14px 22px 20px; }
.mini .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
.mini .row:last-child { border-bottom: 0; }
.mini .row span:first-child { color: var(--muted); }
.mini .msg { font-size: 14.5px; line-height: 1.5; color: var(--body); margin: 0; }

.band { padding: clamp(72px, 12vh, 140px) var(--gutter); }
h2.big2 { font-weight: 650; font-size: clamp(40px, 6vw, 72px); line-height: .98; letter-spacing: -.04em; color: var(--ink); margin: 0; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 96px); align-items: start; }
.split p.lede { color: var(--copy); font-size: 18px; max-width: 460px; margin: 22px 0 0; }
.table { border-top: 1px solid var(--border); }
.table .tr { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--border); }
.table .tr b { font-weight: 600; color: var(--ink); } .table .tr span { color: var(--copy); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 44px; }
.nums .card { padding: 26px 28px 28px; }
.nums .big { font-size: clamp(40px, 5vw, 64px); font-weight: 650; letter-spacing: -.04em; color: var(--ink); line-height: 1; }
.nums p { margin: 12px 0 0; color: var(--copy); font-size: 15px; }
.dark { background: var(--trust); color: var(--foot-ink); border-radius: 36px 36px 0 0; padding: clamp(64px, 11vh, 120px) 0; }
.dark h2 { font-weight: 650; font-size: clamp(40px, 6vw, 72px); line-height: .98; letter-spacing: -.04em; margin: 0; max-width: 12em; }
.dark p { color: var(--foot-copy); font-size: 18px; max-width: 520px; margin: 22px 0 0; }
.dark .pts { margin-top: 48px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--foot-border); }
.dark .pt { padding: 22px 24px 0 0; } .dark .pt b { display: block; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
.dark .pt span { color: var(--foot-quiet); font-size: 15px; }
.foot { background: var(--deep); color: var(--foot-quiet); padding: 28px 0 40px; font-size: 14px; border-top: 1px solid var(--foot-border); }
.foot .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.foot a { color: var(--foot-copy); }
.dropveil { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; background: rgba(243,244,245,.9); backdrop-filter: blur(10px); }
.dropveil.on { display: grid; }
.dropveil div { font-weight: 650; font-size: clamp(32px, 5vw, 60px); letter-spacing: -.04em; color: var(--ink); text-align: center; padding: 56px 72px; border: 2px dashed var(--river); border-radius: 32px; background: var(--white); }

/* ---------- app ---------- */
.app { max-width: 1240px; margin: 0 auto; padding: 28px var(--gutter) 90px; }
.app-h { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.app-h h1 { font-weight: 650; font-size: clamp(40px, 6.4vw, 88px); line-height: .95; letter-spacing: -.045em; color: var(--ink); margin: 0; }
.eyebrow { color: var(--muted); font-size: 14px; margin-bottom: 10px; font-weight: 500; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; }
.opt { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.opt input { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; font-size: 15px; font-weight: 500; color: var(--ink); width: 118px; }
.opt input:focus { outline: 2px solid var(--river); outline-offset: 1px; border-color: transparent; }
.opt.wide input { width: 210px; } .opt.nar input { width: 78px; }

.tabs { display: flex; gap: 8px; margin-bottom: 22px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.tab { flex: none; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid var(--border); color: var(--copy);
  font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover { border-color: var(--border-strong); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--river); flex: none; }
.dot.warn { background: #d49a2e; } .dot.bad { background: var(--danger); }
.tab[aria-selected="true"] .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.kpi { padding: 22px 24px 24px; }
.kpi .l { color: var(--muted); font-size: 14px; font-weight: 500; }
.kpi .v { font-weight: 650; font-size: clamp(38px, 4.4vw, 58px); line-height: 1; letter-spacing: -.04em; color: var(--ink); margin-top: 14px; }
.kpi .v small { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.kpi.bad .v { color: var(--danger); } .kpi.warn .v { color: var(--amber); }
.meter { height: 6px; border-radius: 3px; background: var(--mist); margin-top: 16px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--river); border-radius: 3px; } .meter i.over { background: var(--danger); }

.panel { margin-bottom: 20px; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 22px 26px 0; }
.panel-h h2 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: -.03em; color: var(--ink); }
.panel-h .sub { color: var(--muted); font-size: 14px; text-align: right; }
.panel-b { padding: 6px 26px 26px; }

/* timeline */
.tl-wrap { overflow-x: auto; padding: 30px 14px 6px; margin: 0 -14px; }
.tl { position: relative; min-width: 680px; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--border); }
.tick span { position: absolute; top: -22px; left: 0; transform: translateX(-50%); font-size: 12px; color: var(--muted); font-weight: 500; }
.openwin { position: absolute; top: 0; bottom: 0; background: rgba(11,107,79,.045); border-radius: 6px; }
.bar { position: absolute; height: 46px; padding: 6px 11px; border-radius: 12px; border: 1px solid rgba(11,107,79,.35); background: var(--river-mist); color: var(--river-deep);
  text-align: left; display: flex; flex-direction: column; justify-content: center; overflow: hidden; line-height: 1.25; transition: transform .15s, box-shadow .15s; }
.bar b { font-weight: 650; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar small { font-size: 11.5px; opacity: .8; white-space: nowrap; }
button.bar:hover, .bar.hl { transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(14,31,24,.35); z-index: 3; }
.bar.warn { background: var(--amber-soft); border-color: rgba(154,100,20,.45); color: #6b4410; }
.bar.bad { background: var(--danger-soft); border-color: var(--danger); color: #6e2230; box-shadow: 0 0 0 3px rgba(156,53,68,.12); }
.bar.moved { border-style: dashed; }
.legend { display: flex; gap: 20px; margin-top: 18px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 10px; border-radius: 4px; border: 1px solid; margin-right: 8px; }

/* schedule + issues */
.cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 14px 12px 10px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 15px 12px 15px 0; border-bottom: 1px solid var(--hair); vertical-align: middle; font-size: 15px; }
tr:last-child td { border-bottom: 0; }
td.t { white-space: nowrap; color: var(--copy); font-weight: 500; }
td .who { display: block; font-weight: 650; color: var(--ink); letter-spacing: -.01em; }
td .tr2 { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
tr.row { transition: background .3s; } tr.row.hl { background: var(--river-mist); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--river-mist); color: var(--river-deep); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--river); }
.chip.warn { background: var(--amber-soft); color: var(--amber); } .chip.warn i { background: #d49a2e; }
.chip.bad { background: var(--danger-soft); color: var(--danger); } .chip.bad i { background: var(--danger); }
.copy { font-size: 13.5px; font-weight: 600; color: var(--river); white-space: nowrap; }
.copy:hover { color: var(--river-deep); text-decoration: underline; text-underline-offset: 3px; }

.issue { display: block; width: 100%; text-align: left; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.issue:last-child { border-bottom: 0; }
.issue:hover .m { color: var(--ink); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.issue .m { margin-top: 8px; font-size: 15px; line-height: 1.4; color: var(--body); }
.allclear { padding: 22px 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -.03em; color: var(--river-deep); }
.allclear small { display: block; margin-top: 6px; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); }

/* fixes */
.fixrow { display: grid; grid-template-columns: minmax(160px, 1.1fr) 1fr auto; gap: 20px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.fixrow:first-child { margin-top: 6px; }
.fixrow .who { font-weight: 650; color: var(--ink); letter-spacing: -.01em; }
.fixrow .tr2 { display: block; color: var(--muted); font-size: 13.5px; }
.fixrow .mv { font-variant-numeric: tabular-nums; color: var(--copy); } .fixrow .mv b { color: var(--river-deep); }
.fixrow .shift { color: var(--muted); font-size: 13.5px; text-align: right; white-space: nowrap; }
.fixbar { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-top: 22px; }
.fixbar p { margin: 0; color: var(--copy); max-width: 52ch; font-size: 15px; }
.warnnote { margin: 14px 0 0; color: var(--amber); font-weight: 500; }

/* fit finder */
.fitform { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-end; margin: 14px 0 18px; }
.fitrow { display: grid; grid-template-columns: minmax(160px, 1.1fr) 1.6fr auto; gap: 20px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.fitrow .when { display: block; font-weight: 650; font-size: 19px; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.fitrow .tag { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.fitrow .tag.free { color: var(--river); font-weight: 600; }
.fitrow .who { color: var(--copy); font-size: 15px; } .fitrow .who b { color: var(--ink); font-weight: 600; } .fitrow .who div + div { margin-top: 6px; }
.fitrow .cp { text-align: right; white-space: nowrap; }
.applied { color: var(--muted); font-size: 14px; margin: 14px 0 0; }

/* overview */
.ov { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.ovc { text-align: left; padding: 22px 24px 24px; background: var(--white); border: 1px solid var(--hair); border-radius: 22px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.ovc:hover { border-color: var(--river); transform: translateY(-2px); }
.ovc h3 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -.03em; color: var(--ink); }
.ovc .d { color: var(--muted); font-size: 13.5px; margin-bottom: 22px; }
.ovc .big { font-size: 42px; font-weight: 650; letter-spacing: -.04em; color: var(--ink); line-height: 1; }
.ovc .big small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 6px; }

.toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px); background: var(--ink); color: #fff; padding: 12px 20px;
  border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 100; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.err { background: var(--danger-soft); color: var(--danger); border: 1px solid #e8bcc3; padding: 14px 18px; border-radius: 14px; margin: 0 0 20px; font-weight: 600; }

@media (max-width: 960px) { .cols, .stage, .split, .nums, .dark .pts { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .nav .m { display: none; } }
@media (max-width: 720px) {
  .nav { grid-template-columns: auto 1fr; } .nav .r { gap: 12px; } .navlink.hide-m { display: none; }
  .hero .lead p { font-size: 18px; } .kpi { padding: 16px 18px 18px; } .panel-h { padding: 18px 18px 0; } .panel-b { padding: 4px 18px 20px; }
  .panel-h .sub { display: none; } .fixrow, .fitrow { grid-template-columns: 1fr; gap: 4px; } .fixrow .shift, .fitrow .cp { text-align: left; }
  .table .tr { grid-template-columns: 1fr; gap: 4px; }
}
@media print { html, body { background: #fff; } .nav, .toast, .tabs, .opts, .copy { display: none !important; } .card { box-shadow: none; } }
</style>

<body>
<nav class="nav" id="nav"></nav>
<div id="root"></div>
<div class="dropveil" id="veil"><div>Drop your CSV</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept=".csv,text/csv" multiple hidden>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;            // fixed, hard-coded SVG markup only
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false && kid !== "") el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};

function focusRow(i) {
  document.querySelectorAll(".hl").forEach(n => n.classList.remove("hl"));
  const row = $(`tr[data-i="${i}"]`); if (!row) return;
  row.classList.add("hl"); row.scrollIntoView({ block: "center", behavior: "smooth" });
  $(`.bar[data-i="${i}"]`)?.classList.add("hl");
  setTimeout(() => document.querySelectorAll(".hl").forEach(n => n.classList.remove("hl")), 1800);
}

const STATUS = { ok: "On track", warn: "Check", bad: "Conflict" };
function schedule(d) {
  const rows = d.appointments.map((a, i) => h("tr", { class: "row", "data-i": i },
    h("td", { class: "t num" }, a.time + " – " + a.end),
    h("td", {}, h("span", { class: "who" }, a.patient), h("span", { class: "tr2" }, (a.moved_from ? "Moved from " + a.moved_from + " · " : "") + a.treatment + (a.notes ? " · " + a.notes : ""))),
    h("td", {}, h("span", { class: "chip " + a.status }, h("i"), STATUS[a.status])),
    h("td", {}, h("button", { class: "copy", onclick: () => copyText(a.confirmation, `Message for ${a.patient.split(" ")[0]} copied`), "aria-label": `Copy message for ${a.patient}` }, a.moved_from ? "Copy new time" : "Copy message"))));
  return panel("Schedule", plural(d.appointments.length, "booking"),
    h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Time", "Patient", "Status", ""].map(c => h("th", {}, c)))), h("tbody", {}, rows))));
}

function issues(d) {
  const kind = k => (k === "overlap" || k === "double_booked_patient") ? "bad" : "warn";
  const items = d.issues.map(i => h("button", {
    class: "issue",
    onclick: () => { const idx = d.appointments.findIndex(a => i.related.includes(a.patient)); if (idx >= 0) focusRow(idx); },
  }, h("span", { class: "chip " + kind(i.kind) }, h("i"), i.label), h("div", { class: "m" }, i.message)));
  return panel("Needs attention", d.issues.length ? plural(d.issues.length, "issue") : "",
    items.length ? h("div", {}, items) : h("div", { class: "allclear" }, "All clear.", h("small", {}, "Nothing to fix on this day.")));
}

function fixes(d, r) {
  const f = d.fix;
  if (!f.moves.length && !f.unplaced.length) return null;
  const rows = f.moves.map(m => h("div", { class: "fixrow" },
    h("div", {}, h("span", { class: "who" }, m.patient), h("span", { class: "tr2" }, m.treatment)),
    h("div", { class: "mv num" }, m.old, " → ", h("b", {}, m.new)),
    h("div", { class: "shift num" }, Math.abs(m.shift_min) + " min " + (m.shift_min < 0 ? "earlier" : "later"))));
  const summary = `${plural(f.moves.length, "booking")} moved · ${f.conflicts_before} scheduling ${f.conflicts_before === 1 ? "conflict" : "conflicts"} → ${f.conflicts_after}`;
  return panel(r.autofix ? "Fixes applied" : "Suggested fixes", "Fewest possible moves, each to the nearest free slot",
    h("div", {}, rows),
    f.unplaced.length ? h("p", { class: "warnnote" }, `${plural(f.unplaced.length, "booking")} can’t fit inside open hours — call ${f.unplaced.map(u => u.patient).join(", ")}.`) : null,
    h("div", { class: "fixbar" },
      r.autofix
        ? [h("p", {}, summary + ". Reschedule messages are ready to copy below."), h("button", { class: "btn2", onclick: () => { S.autofix = false; analyse(); } }, "Revert to original")]
        : [pill("Apply fixes", () => { S.autofix = true; analyse(); }), h("p", {}, summary + " if applied.")]));
}

function fitPanel(d, r) {
  const F = S.fit;
  const field = (label, key, type, extra) => h("label", { class: "opt" }, label,
    h("input", { type, value: F[key], ...extra, onchange: e => { F[key] = type === "number" ? Number(e.target.value) : e.target.value.trim(); F.options = null; } }));
  const find = async () => {
    try {
      const res = await fetch("/api/fit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ files: S.files, ...S.opts, for_day: d.day, duration: F.duration, treatment: F.treatment, prefer: F.prefer }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      F.options = data; F.day = d.day; render();
    } catch (e) { toast(e.message); }
  };
  const res = F.options && F.day === d.day ? F.options : null;
  const rows = res ? res.options.map(o => h("div", { class: "fitrow" },
    h("div", {}, h("span", { class: "when" }, o.time + "–" + o.end),
      h("span", { class: "tag" + (o.moves.length ? "" : " free") }, o.moves.length ? plural(o.moves.length, "booking") + " moves · " + o.disruption_min + " min of shifting" : "Nobody moves")),
    o.moves.length
      ? h("div", { class: "who" }, o.moves.map(m => h("div", {}, h("b", {}, m.patient), " ", m.old, " → ", h("b", {}, m.new))))
      : h("div", { class: "who" }, o.free_from === o.free_to ? "Only this start works." : `Any start from ${o.free_from} to ${o.free_to} works.`),
    h("div", { class: "cp" }, o.moves.length ? h("button", { class: "copy", onclick: () => copyText(o.moves.map(m => m.message).join("\n\n"), "Reschedule text copied") }, "Copy message" + (o.moves.length > 1 ? "s" : "")) : null))) : [];
  return panel("Fit someone in", "Ranked by who has to move, then by how far",
    h("div", { class: "fitform" },
      field("Minutes", "duration", "number", { min: 5, max: 480, step: 5, class: "num" }),
      field("Treatment", "treatment", "text"),
      field("Prefers (HH:MM)", "prefer", "text", { placeholder: "any time" }),
      pill("Find a slot", find)),
    res && !res.options.length ? h("div", { class: "allclear" }, "Nowhere today.", h("small", {}, "Even moving everyone who can move, a " + res.duration + "-minute booking doesn’t fit.")) : h("div", {}, rows),
    res && res.base_moves ? h("p", { class: "applied" }, "Judged on the day after its existing conflicts are fixed, so each option’s cost is only what the new booking adds.") : null);
}

function dayView(d, r) { return h("div", {}, kpis(r.totals, d.stats), timeline(d, r), fixes(d, r), fitPanel(d, r), h("div", { class: "cols" }, schedule(d), issues(d))); }

function render() {
  nav();
  const root = $("#root"); root.replaceChildren();
  if (!S.result) { root.append(landing()); return; }
  const r = S.result;
  root.append(h("main", { class: "app" }, ...[
    S.error && h("div", { class: "err" }, S.error),
    head(r),
    r.mode === "week" && tabs(r),
    S.view === "overview" && r.mode === "week" ? overview(r) : dayView(r.days[Number(S.view) || 0], r),
  ].filter(Boolean)));
}

$("#picker").addEventListener("change", e => { if (e.target.files.length) loadFiles([...e.target.files]); e.target.value = ""; });
document.addEventListener("click", () => $("#menuList")?.classList.remove("open"));
let dragDepth = 0; const veil = $("#veil");
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; veil.classList.add("on"); });
addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; veil.classList.remove("on");
  const fs = [...e.dataTransfer.files].filter(f => /\.csv$/i.test(f.name));
  if (fs.length) loadFiles(fs); else { S.error = "Please drop .csv files."; render(); }
});
render();
const q = new URLSearchParams(location.search);   // ?sample=day|week[&view=overview|0..4][&autofix=1] for demos
if (q.get("autofix")) S.autofix = true;
if (q.get("sample")) loadSample(q.get("sample") === "week" ? "week" : "day", { autofix: !!q.get("autofix") }).then(() => { if (q.get("view") && S.result) { S.view = q.get("view"); render(); } });
</script>
</body>
</html>
