<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SlotBrief — front-desk briefing for small clinics</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #faf9f6; --line: #e6e3dc; --line-strong: #d3cfc4;
  --text: #1c1b18; --text-2: #5b5850; --text-3: #8a867b;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #d9efec; --brand-line: #86c5be;
  --warn: #b45309; --warn-soft: #fdecc8; --warn-line: #e3a54a;
  --bad: #b91c1c; --bad-soft: #fde1e1; --bad-line: #ee9a9a;
  --ok: #15803d; --ok-soft: #dcf3e3;
  --shadow: 0 1px 2px rgba(28,27,24,.06), 0 4px 16px rgba(28,27,24,.05);
  --radius: 12px; --radius-sm: 8px;
  --font: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12120f; --surface: #1b1a17; --surface-2: #211f1c; --line: #2f2d28; --line-strong: #43403a;
    --text: #f1efe9; --text-2: #b4b0a4; --text-3: #8a867b;
    --brand: #2dd4bf; --brand-ink: #062b27; --brand-soft: #123a36; --brand-line: #1f6b63;
    --warn: #f5b04c; --warn-soft: #3a2a10; --warn-line: #8a5d1c;
    --bad: #f87171; --bad-soft: #3d1717; --bad-line: #8a2f2f;
    --ok: #4ade80; --ok-soft: #14301e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 86%, transparent); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; font-size: 17px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 999px; background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand-line); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn svg { flex: none; }

main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.card-h .sub { color: var(--text-3); font-size: 13px; }
.card-b { padding: 18px; }

/* empty state */
.hero { text-align: center; padding: 44px 20px 8px; }
.hero h1 { font-size: clamp(28px, 4.4vw, 42px); line-height: 1.12; letter-spacing: -.03em; margin: 0 0 12px; }
.hero p { max-width: 620px; margin: 0 auto; color: var(--text-2); font-size: 17px; }
.drop { margin: 30px auto 0; max-width: 720px; border: 2px dashed var(--line-strong); border-radius: 16px; padding: 38px 24px;
  background: var(--surface); text-align: center; transition: .15s; }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .big { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 12px; display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand); }
.drop h3 { margin: 0 0 4px; font-size: 18px; }
.drop p { margin: 0 0 18px; color: var(--text-2); font-size: 14px; }
.drop .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; max-width: 900px; margin: 36px auto 0; }
.fact { padding: 16px; text-align: left; }
.fact b { display: block; margin-bottom: 4px; }
.fact span { color: var(--text-2); font-size: 14px; }
.fmt { max-width: 720px; margin: 26px auto 0; font-size: 13px; color: var(--text-2); }
.fmt code { background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 18px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.field input { padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface);
  font-size: 14px; font-weight: 500; min-width: 0; }
.field.clinic input { width: 230px; }
.field.hrs input { width: 96px; }
.field.gap input { width: 76px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; padding: 6px; z-index: 30; display: none; }
.menu-list.open { display: block; }
.menu-list button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: none;
  border-radius: 6px; font-size: 14px; }
.menu-list button:hover { background: var(--surface-2); }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 14px 16px; }
.kpi .l { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.kpi .v small { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 4px; }
.kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); } .kpi.warn .v { color: var(--warn); }
.meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.meter i.over { background: var(--bad); }

/* day tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; }
.tab { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 14px; text-align: left; }
.tab small { display: block; font-weight: 500; color: var(--text-3); font-size: 12px; }
.tab[aria-selected="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; background: var(--brand-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

/* timeline */
.tl-wrap { padding: 8px 18px 14px; overflow-x: auto; }
.tl { position: relative; margin-top: 26px; min-width: 640px; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
.tick span { position: absolute; top: -20px; left: -14px; width: 28px; text-align: center; font-size: 11px; color: var(--text-3); }
.openwin { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--brand) 6%, transparent); border-radius: 4px; }
.bar { position: absolute; height: 40px; padding: 3px 9px; border-radius: 8px; border: 1px solid var(--brand-line); background: var(--brand-soft);
  color: var(--text); text-align: left; display: flex; flex-direction: column; justify-content: center; overflow: hidden; line-height: 1.2; }
.bar b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar small { font-size: 11px; color: var(--text-2); white-space: nowrap; }
.bar.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.bar.bad { background: var(--bad-soft); border-color: var(--bad-line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 22%, transparent); }
.bar:hover, .bar.hl { transform: translateY(-1px); z-index: 3; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.legend { display: flex; gap: 16px; padding: 0 18px 14px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1px solid; margin-right: 6px; vertical-align: -1px; }

/* grid */
.cols { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(280px, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
tr:last-child td { border-bottom: 0; }
tr.row { transition: background .25s; }
tr.row.hl { background: var(--brand-soft); }
td.t { white-space: nowrap; font-weight: 600; }
td .tr { display: block; color: var(--text-3); font-size: 12.5px; }
.tablewrap { overflow-x: auto; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.iconbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 5px 8px; display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.iconbtn:hover { color: var(--text); background: var(--surface-2); }

/* issues */
.issue { display: flex; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.issue:last-child { border-bottom: 0; }
.issue:hover { background: var(--surface-2); }
.issue .ic { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.issue.bad .ic { background: var(--bad-soft); color: var(--bad); }
.issue.warn .ic { background: var(--warn-soft); color: var(--warn); }
.issue .k { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.issue.bad .k { color: var(--bad); } .issue.warn .k { color: var(--warn); }
.issue .m { font-size: 14px; color: var(--text); }
.allclear { display: flex; gap: 12px; align-items: center; padding: 20px 18px; color: var(--ok); font-weight: 600; }

/* overview */
.ov { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.ovc { padding: 16px; text-align: left; }
.ovc:hover { border-color: var(--brand); }
.ovc h3 { margin: 0; font-size: 15px; }
.ovc .d { color: var(--text-3); font-size: 12.5px; margin-bottom: 10px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.err { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-weight: 600; }
footer { text-align: center; color: var(--text-3); font-size: 12.5px; padding: 8px 0 28px; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
  .top-in { padding: 10px 14px; gap: 10px; }
  .pill .long, .card-h .sub { display: none; }
  .btn, .pill, .tab { white-space: nowrap; }
  main { padding: 16px 14px 48px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 12px; } .kpi .v { font-size: 22px; }
  .toolbar .spacer { display: none; }
  .field.clinic { flex: 1 1 100%; } .field.clinic input { width: 100%; }
  .hero { padding-top: 24px; } .drop { padding: 26px 16px; }
}
@media print {
  header.top, .toolbar, .tabs, .iconbtn, .menu, .toast, .btn, footer { display: none !important; }
  body { background: #fff; } .card { box-shadow: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15l2 2 4-4"/></svg></span>SlotBrief</div>
    <span class="pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Local only<span class="long"> · no data leaves this machine</span></span>
    <span class="spacer"></span>
    <button class="btn" id="newBtn" hidden>Load another file</button>
  </div>
</header>
<main id="app"></main>
<footer>SlotBrief · built for Next Byte Hacks V5 · standard-library Python, no cloud</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept=".csv,text/csv" multiple hidden>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;            // only used for the fixed SVG icons below
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const svg = (d, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  upload: '<path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  down: '<path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  warn: '<path d="M12 4l9 16H3L12 4zM12 10v4M12 17.5v.1"/>',
  bad: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  print: '<path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-5a2 2 0 012-2h12a2 2 0 012 2v5a1 1 0 01-1 1h-2M7 14h10v6H7z"/>',
  more: '<path d="M6 12h.01M12 12h.01M18 12h.01"/>',
};
const icon = (n, s) => h("span", { html: svg(I[n], s), style: "display:inline-flex" });

const S = { files: [], opts: { clinic: "Indie Clinic", hours: "09:00-18:00", min_gap: 10 }, result: null, view: "0", error: "" };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("show"), 1900);
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(msg);
}
function download(name, text, type) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

async function analyse() {
  S.error = "";
  try {
    const res = await fetch("/api/analyse", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: S.files, ...S.opts }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    S.result = data;
    if (S.view !== "overview" && !(S.view in data.days)) S.view = data.mode === "week" ? "overview" : "0";
  } catch (e) { S.error = e.message; if (!S.result) S.files = []; }
  render();
}
async function loadFiles(list) {
  const files = [];
  for (const f of list) files.push({ name: f.name, text: await f.text() });
  S.files = files; S.result = null; S.view = "0"; await analyse();
  if (S.result) { S.view = S.result.mode === "week" ? "overview" : "0"; render(); }
}
async function loadSample(kind) {
  const p = await (await fetch("/api/sample?kind=" + kind)).json();
  S.files = p.files; S.opts.clinic = p.clinic; S.result = null; await analyse();
  if (S.result) { S.view = S.result.mode === "week" ? "overview" : "0"; render(); }
}

/* ---------- empty state ---------- */
function emptyState() {
  const drop = h("div", { class: "drop", id: "drop" },
    h("div", { class: "big", html: svg(I.upload, 26) }),
    h("h3", {}, "Drop your appointments CSV here"),
    h("p", {}, "One day, or a whole week (several files named YYYY-MM-DD.csv, or one file with a date column)."),
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: () => $("#picker").click() }, "Choose CSV file"),
      h("button", { class: "btn", onclick: () => loadSample("day") }, "Try a sample day"),
      h("button", { class: "btn", onclick: () => loadSample("week") }, "Try a sample week")));
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { const fs = [...e.dataTransfer.files].filter(f => /\.csv$/i.test(f.name)); if (fs.length) loadFiles(fs); else { S.error = "Please drop .csv files."; render(); } });
  const fact = (b, t) => h("div", { class: "card fact" }, h("b", {}, b), h("span", {}, t));
  return h("div", {},
    S.error && h("div", { class: "err" }, S.error),
    h("section", { class: "hero" },
      h("h1", {}, "Catch scheduling mistakes before the patient does."),
      h("p", {}, "Load a day’s appointments and SlotBrief spots overlaps, tight turnarounds, double-booked patients and unusable phone numbers — then drafts the confirmations and exports your calendar.")),
    drop,
    h("div", { class: "facts" },
      fact("Five checks, instantly", "Overlaps, tight gaps, late starts, double-booked patients, bad phone numbers."),
      fact("Ready-to-send messages", "A confirmation text per patient, one click to copy."),
      fact("Works with your calendar", "Download a standards-compliant .ics for Apple or Google Calendar."),
      fact("Private by design", "Runs on this computer. No account, no cloud, no tracking.")),
    h("p", { class: "fmt" }, "CSV columns: ", ...["time", "duration_min", "patient", "treatment", "phone", "notes", "date"].flatMap((c, i, a) => [h("code", {}, c), i < a.length - 1 ? " " : ""]), " — ", h("code", {}, "notes"), " and ", h("code", {}, "date"), " are optional."));
}

/* ---------- loaded state ---------- */
const mins = t => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const worst = d => d.appointments.some(a => a.status === "bad") ? "bad" : d.issues.length ? "warn" : "ok";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const niceDay = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });

function toolbar() {
  const mk = (cls, label, key, type = "text", extra = {}) => h("label", { class: "field " + cls }, label,
    h("input", { type, value: S.opts[key], ...extra, onchange: e => { S.opts[key] = type === "number" ? Number(e.target.value) : e.target.value.trim(); analyse(); } }));
  const list = h("div", { class: "card menu-list", id: "menuList", role: "menu" },
    mi("down", "Download calendar (.ics)", () => download(S.result.mode === "week" ? "slotbrief-week.ics" : `slotbrief-${S.result.days[0].day}.ics`, S.result.ics, "text/calendar")),
    mi("copy", "Copy all confirmation texts", () => copyText(S.result.days.flatMap(d => d.appointments.map(a => a.confirmation)).join("\n\n"), "All confirmations copied")),
    mi("down", "Download report (.json)", () => { const { ics, ...rest } = S.result; download("slotbrief-report.json", JSON.stringify(rest, null, 2), "application/json"); }),
    mi("print", "Print this view", () => window.print()));
  function mi(ic, label, fn) { return h("button", { role: "menuitem", onclick: () => { list.classList.remove("open"); fn(); } }, icon(ic), label); }
  return h("div", { class: "toolbar" },
    mk("clinic", "Clinic name", "clinic", "text", { maxlength: 80 }),
    mk("hrs", "Open hours", "hours", "text", { placeholder: "09:00-18:00", "aria-label": "Open hours, HH:MM-HH:MM" }),
    mk("gap", "Min gap (min)", "min_gap", "number", { min: 0, max: 240 }),
    h("span", { class: "spacer" }),
    h("div", { class: "menu" },
      h("button", { class: "btn primary", "aria-haspopup": "menu", onclick: e => { e.stopPropagation(); list.classList.toggle("open"); } }, icon("down"), "Export"),
      list));
}

function kpis(totals, scope) {
  const util = scope.utilisation_pct ?? totals.avg_utilisation_pct;
  const flags = scope.flags ?? totals.flags;
  const card = (l, v, cls = "", small = "", extra) => h("div", { class: "card kpi " + cls }, h("div", { class: "l" }, l), h("div", { class: "v num" }, v, small && h("small", {}, small)), extra);
  return h("div", { class: "kpis" },
    card("Bookings", scope.bookings ?? totals.bookings),
    card("Chair time", Math.floor((scope.chair_minutes ?? totals.chair_minutes) / 60) + "h " + String((scope.chair_minutes ?? totals.chair_minutes) % 60).padStart(2, "0"), "", "booked"),
    card(scope.utilisation_pct != null ? "Utilisation" : "Avg utilisation", util + "%", util > 100 ? "bad" : "", "", h("div", { class: "meter" }, h("i", { class: util > 100 ? "over" : "", style: `width:${Math.min(util, 100)}%` }))),
    card("Needs attention", flags, flags ? "warn" : "ok", flags ? plural(flags, "issue").replace(/^\d+ /, "") : "all clear"));
}

function tabs(r) {
  const t = [h("button", { class: "tab", role: "tab", "aria-selected": String(S.view === "overview"), onclick: () => { S.view = "overview"; render(); } }, "Week overview")];
  r.days.forEach((d, i) => t.push(h("button", { class: "tab", role: "tab", "aria-selected": String(S.view === String(i)), onclick: () => { S.view = String(i); render(); } },
    h("span", { class: "dot " + worst(d) }), h("span", {}, niceDay(d.day), h("small", {}, d.stats.flags ? plural(d.stats.flags, "flag") : "clear")))));
  return h("div", { class: "tabs", role: "tablist" }, t);
}

function overview(r) {
  return h("div", {},
    kpis(r.totals, {}),
    h("div", { class: "ov" }, r.days.map((d, i) => h("button", { class: "card ovc", style: "cursor:pointer", onclick: () => { S.view = String(i); render(); } },
      h("h3", {}, d.weekday), h("div", { class: "d" }, niceDay(d.day)),
      h("div", { class: "num" }, plural(d.stats.bookings, "booking"), " · ", d.stats.utilisation_pct + "%"),
      h("div", { class: "meter" }, h("i", { class: d.stats.utilisation_pct > 100 ? "over" : "", style: `width:${Math.min(d.stats.utilisation_pct, 100)}%` })),
      h("div", { style: "margin-top:10px" }, h("span", { class: "chip " + worst(d) }, d.stats.flags ? plural(d.stats.flags, "flag") : "All clear"))))));
}

function timeline(d, r) {
  const open = mins(r.hours.open), close = mins(r.hours.close);
  let lo = Math.min(open, ...d.appointments.map(a => mins(a.time)));
  let hi = Math.max(close, ...d.appointments.map(a => mins(a.time) + a.duration_min));
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60; const total = hi - lo;
  const laneEnd = []; const placed = [...d.appointments].map((a, i) => ({ a, i })).sort((x, y) => mins(x.a.time) - mins(y.a.time)).map(({ a, i }) => {
    let lane = laneEnd.findIndex(e => e <= mins(a.time)); if (lane < 0) { lane = laneEnd.length; laneEnd.push(0); }
    laneEnd[lane] = mins(a.time) + a.duration_min; return { a, i, lane };
  });
  const pct = m => ((m - lo) / total * 100).toFixed(3) + "%";
  const el = h("div", { class: "tl", style: `height:${laneEnd.length * 46 + 4}px` },
    h("div", { class: "openwin", style: `left:${pct(open)};width:${((close - open) / total * 100).toFixed(3)}%` }));
  for (let m = lo; m <= hi; m += 60) el.append(h("i", { class: "tick", style: `left:${pct(m)}` }, h("span", { class: "num" }, String(m / 60).padStart(2, "0"))));
  placed.forEach(({ a, i, lane }) => el.append(h("button", {
    class: "bar " + a.status, "data-i": i, style: `left:${pct(mins(a.time))};width:${(a.duration_min / total * 100).toFixed(3)}%;top:${lane * 46}px`,
    title: `${a.patient} · ${a.treatment} · ${a.time}–${a.end}`, "aria-label": `${a.patient}, ${a.treatment}, ${a.time} to ${a.end}, ${a.status === "ok" ? "no issues" : a.status === "warn" ? "worth a look" : "time conflict"}`,
    onclick: () => focusRow(i),
  }, h("b", {}, a.patient), h("small", { class: "num" }, a.time + "–" + a.end))));
  return h("div", { class: "card" },
    h("div", { class: "card-h" }, h("h2", {}, "Chair timeline"), h("span", { class: "sub" }, "shaded = open hours · click a booking to jump to it")),
    h("div", { class: "tl-wrap" }, el),
    h("div", { class: "legend" },
      h("span", {}, h("i", { style: "background:var(--brand-soft);border-color:var(--brand-line)" }), "On track"),
      h("span", {}, h("i", { style: "background:var(--warn-soft);border-color:var(--warn-line)" }), "Worth a look"),
      h("span", {}, h("i", { style: "background:var(--bad-soft);border-color:var(--bad-line)" }), "Time conflict")));
}

function focusRow(i) {
  document.querySelectorAll(".hl").forEach(n => n.classList.remove("hl"));
  const row = $(`tr[data-i="${i}"]`); if (!row) return;
  row.classList.add("hl"); row.scrollIntoView({ block: "center", behavior: "smooth" });
  $(`.bar[data-i="${i}"]`)?.classList.add("hl");
  setTimeout(() => document.querySelectorAll(".hl").forEach(n => n.classList.remove("hl")), 1800);
}

const CHIP = { ok: ["check", "On track"], warn: ["warn", "Check"], bad: ["bad", "Conflict"] };
function schedule(d) {
  const rows = d.appointments.map((a, i) => h("tr", { class: "row", "data-i": i },
    h("td", { class: "t num" }, a.time + "–" + a.end),
    h("td", {}, a.patient, h("span", { class: "tr" }, a.treatment + (a.notes ? " · " + a.notes : ""))),
    h("td", {}, h("span", { class: "chip " + a.status }, icon(CHIP[a.status][0], 13), CHIP[a.status][1])),
    h("td", {}, h("button", { class: "iconbtn", onclick: () => copyText(a.confirmation, `Message for ${a.patient.split(" ")[0]} copied`), "aria-label": `Copy confirmation message for ${a.patient}` }, icon("copy", 14), "Copy text"))));
  return h("div", { class: "card" },
    h("div", { class: "card-h" }, h("h2", {}, "Schedule"), h("span", { class: "sub" }, plural(d.appointments.length, "booking"))),
    h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Time", "Patient", "Status", "Message"].map(c => h("th", {}, c)))), h("tbody", {}, rows))));
}

function issues(d) {
  const kind = k => (k === "overlap" || k === "double_booked_patient") ? "bad" : "warn";
  const items = d.issues.map(i => h("button", {
    class: "issue " + kind(i.kind),
    onclick: () => { const idx = d.appointments.findIndex(a => i.related.includes(a.patient)); if (idx >= 0) focusRow(idx); },
  }, h("span", { class: "ic" }, icon(kind(i.kind) === "bad" ? "bad" : "warn", 16)),
     h("span", {}, h("span", { class: "k" }, i.label), h("div", { class: "m" }, i.message))));
  return h("div", { class: "card" },
    h("div", { class: "card-h" }, h("h2", {}, "Needs attention"), h("span", { class: "sub" }, d.issues.length ? plural(d.issues.length, "issue") : "")),
    items.length ? h("div", {}, items) : h("div", { class: "allclear" }, icon("check", 20), "All clear — nothing to fix today."));
}

function dayView(d, r) {
  return h("div", {}, kpis(r.totals, d.stats), timeline(d, r), h("div", { class: "cols" }, schedule(d), issues(d)));
}

function render() {
  const app = $("#app"); app.replaceChildren();
  $("#newBtn").hidden = !S.result;
  if (!S.result) { app.append(emptyState()); return; }
  const r = S.result;
  app.append(...[
    S.error && h("div", { class: "err" }, S.error),
    toolbar(),
    r.mode === "week" && tabs(r),
    S.view === "overview" && r.mode === "week" ? overview(r) : dayView(r.days[Number(S.view) || 0], r),
  ].filter(Boolean));
}

$("#newBtn").addEventListener("click", () => { S.result = null; S.files = []; S.error = ""; render(); });
$("#picker").addEventListener("change", e => { if (e.target.files.length) loadFiles([...e.target.files]); e.target.value = ""; });
document.addEventListener("click", () => $("#menuList")?.classList.remove("open"));
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { if (!$("#drop")?.contains(e.target)) e.preventDefault(); });
render();
const q = new URLSearchParams(location.search);   // ?sample=day|week[&view=overview|0..4] for demos
if (q.get("sample")) loadSample(q.get("sample") === "week" ? "week" : "day").then(() => { if (q.get("view") && S.result) { S.view = q.get("view"); render(); } });
</script>
</body>
</html>
